services:
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION-20}
        PNPM_VERSION: ${PNPM_VERSION-10}
    environment:
      NODE_ENV: development
      PORT: ${API_PORT-3000}
      CI: 'true'
    ports:
      - '${API_PORT-3000}:${API_PORT-3000}'
    volumes:
      - ./packages/api:/app
      - /app/node_modules
    command: sh -c "pnpm i --no-frozen-lockfile && node --watch src/server.js"

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION-20}
        PNPM_VERSION: ${PNPM_VERSION-10}
    environment:
      VITE_API_HOST: api
      VITE_API_BASE: ''
      VITE_API_PORT: ${API_PORT-3000}
      WEB_PORT: ${WEB_PORT-5173}
      CI: 'true'
    ports:
      - '${WEB_PORT-5173}:${WEB_PORT-5173}'
    volumes:
      - ./packages/web:/app
      - /app/node_modules
    command: sh -c "pnpm i --no-frozen-lockfile && pnpm run dev -- --port ${WEB_PORT-5173}"
